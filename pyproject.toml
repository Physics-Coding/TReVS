[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trevs-reproducibility"
version = "0.1.0"
description = "Anonymous inference and evaluation artifact for TReVS visual-token pruning"
readme = "README.md"
requires-python = "==3.10.*"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# These runtime extras are mutually exclusive because the Qwen integration
# requires a newer PyTorch/Transformers stack than LLaVA and Video-LLaVA.
llava-family = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.37.2",
    "tokenizers==0.15.1",
    "numpy==1.26.4",
    "pillow==10.4.0",
    "accelerate==0.21.0",
    "bitsandbytes==0.45.5",
    "sentencepiece==0.1.99",
    "shortuuid==1.0.13",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==0.6.13",
    "scikit-learn==1.2.2",
    "safetensors==0.7.0",
    "requests==2.32.5",
    "httpx==0.24.0",
    "decord==0.6.0",
    "av==16.1.0",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
]
qwen = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers @ git+https://github.com/huggingface/transformers@a25b8efa0a3220da89493a72f57081aa5720291f",
    "tokenizers==0.22.2",
    "numpy==2.2.6",
    "pillow==12.1.1",
    "accelerate==1.13.0",
    "sentencepiece==0.1.99",
    "shortuuid==1.0.13",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==0.6.13",
    "scikit-learn==1.7.2",
    "safetensors==0.7.0",
    "requests==2.32.5",
    "httpx==0.24.0",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
]
test = []

[tool.setuptools]
include-package-data = false
py-modules = ["qwen_vl_utils"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["llava*", "qwen*", "videollava*", "evaluation*"]
exclude = ["*.tests*", "scripts*", "playground*", "docs*", "outputs*"]

[tool.wheel]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
